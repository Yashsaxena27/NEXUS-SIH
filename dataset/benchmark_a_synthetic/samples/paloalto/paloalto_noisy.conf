# Palo Alto Networks PAN-OS Configuration Export
# Device: PA-5220
# Software version: 10.2.5-h1
# This is a production configuration with extensive rules

set deviceconfig system hostname PA-FW-NOISY
set deviceconfig system domain-name enterprise.example.com
set deviceconfig system login-banner "***  WARNING  ***  Unauthorized access to this system is prohibited. All activity is monitored."
set deviceconfig system service disable-telnet yes
set deviceconfig system service disable-http yes
set deviceconfig system idle-timeout 10
set deviceconfig system ip-address 10.100.0.1
set deviceconfig system netmask 255.255.255.0
set deviceconfig system default-gateway 10.100.0.254
set deviceconfig system panorama-server 10.100.1.100
set deviceconfig system panorama-server-2 10.100.1.101
set deviceconfig system update-server updates.paloaltonetworks.com
set deviceconfig system dns-setting servers primary 10.1.1.10
set deviceconfig system dns-setting servers secondary 10.1.1.11
set deviceconfig system ntp-servers primary-ntp-server ntp-server-address ntp1.corp.example.com
set deviceconfig system ntp-servers secondary-ntp-server ntp-server-address ntp2.corp.example.com
set deviceconfig setting config rematch yes
set deviceconfig setting management idle-timeout 10
set shared log-settings syslog SIEM-Server server SIEM-Host transport TCP port 514 facility LOG_USER
set shared log-settings syslog SIEM-Server server SIEM-Host server 10.5.5.100
set shared log-settings syslog Backup-Syslog server Backup-Host server 10.5.5.101
set shared log-settings profiles default match-list traffic-log log-type traffic send-syslog SIEM-Server
set shared log-settings profiles default match-list threat-log log-type threat send-syslog SIEM-Server
set network interface ethernet ethernet1/1 layer3 ip 172.16.1.1/24
set network interface ethernet ethernet1/1 comment "INTERNET-FACING"
set network interface ethernet ethernet1/2 layer3 ip 10.10.0.1/16
set network interface ethernet ethernet1/2 comment "INTERNAL-CORE"
set network interface ethernet ethernet1/3 layer3 ip 192.168.100.1/24
set network interface ethernet ethernet1/3 comment "DMZ-SERVERS"
set network interface ethernet ethernet1/4 layer3 ip 10.20.0.1/24
set network interface ethernet ethernet1/4 comment "MANAGEMENT"
set network interface ethernet ethernet1/5 layer3 ip 10.30.0.1/24
set network interface ethernet ethernet1/5 comment "GUEST-WIFI"
set network interface loopback units loopback.1 ip 10.255.255.1/32
set network interface loopback units loopback.1 comment "MGMT-LOOPBACK"
set network virtual-router default interface ethernet1/1
set network virtual-router default interface ethernet1/2
set network virtual-router default interface ethernet1/3
set network virtual-router default interface ethernet1/4
set network virtual-router default routing-table ip static-route default nexthop ip-address 172.16.1.254 interface ethernet1/1
set network virtual-router default routing-table ip static-route internal nexthop ip-address 10.10.0.254 interface ethernet1/2
set network profiles zone-protection-profile ZONE-PROTECT flood tcp-syn enable yes
set network profiles zone-protection-profile ZONE-PROTECT flood tcp-syn red alarm-rate 10000 activate-rate 5000 maximal-rate 40000
set rulebase security rules WEB-BROWSING from TRUST to UNTRUST source any destination any application web-browsing ssl action allow log-start yes
set rulebase security rules DNS-ALLOW from TRUST to UNTRUST source any destination any application dns action allow
set rulebase security rules BLOCK-MALWARE from UNTRUST to TRUST source any destination any application any action deny profile-setting profiles virus default
set rulebase security rules MGMT-ACCESS from MGMT to any source 10.20.0.0/24 destination any application ssh https action allow
set rulebase security rules DEFAULT-DENY from any to any source any destination any application any action deny log-start yes log-end yes
set rulebase nat rules OUTBOUND-NAT source-translation dynamic-ip-and-port interface-address interface ethernet1/1
