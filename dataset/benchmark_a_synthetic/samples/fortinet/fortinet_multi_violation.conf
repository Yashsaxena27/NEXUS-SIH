config system global
    set hostname "FORTI-FW-08"
    set admin-sport 80
    set admintimeout 0
    set admin-telnet enable
end
config system admin
    edit "admin"
        set accprofile "prof_admin"
        set password ENC hash
    next
end
config log syslogd setting
    set status disable
end
config system ntp
    set ntpsync enable
    set type custom
    config ntpserver
        edit 1
            set server "10.1.1.50"
        next
    end
end
config system snmp community
    edit 1
        set name "public"
    next
end
