set deviceconfig system hostname PA-FW-VARIANT
set deviceconfig system   login-banner   "Notice: Access is restricted"
set  deviceconfig  system  service  disable-telnet   yes
set deviceconfig system service  disable-http   yes
set  deviceconfig  system  idle-timeout   15
set   deviceconfig  system  ntp-servers  primary-ntp-server  ntp-server-address  pool.ntp.org
set shared  log-settings  syslog  MyLog  server  MyHost  server  10.3.3.100
set network interface ethernet ethernet1/1 layer3 ip 10.0.0.1/24
