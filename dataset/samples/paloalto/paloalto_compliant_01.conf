set deviceconfig system hostname PA-FW-01
set deviceconfig system domain-name corp.example.com
set deviceconfig system login-banner "WARNING: Authorized Access Only. All activity is monitored and logged."
set deviceconfig system timezone US/Eastern
set deviceconfig system service disable-telnet yes
set deviceconfig system service disable-http yes
set deviceconfig system idle-timeout 10
set deviceconfig system ip-address 10.0.0.1
set deviceconfig system netmask 255.255.255.0
set deviceconfig system default-gateway 10.0.0.254
set deviceconfig system dns-setting servers primary 8.8.8.8
set deviceconfig system dns-setting servers secondary 8.8.4.4
set deviceconfig system ntp-servers primary-ntp-server ntp-server-address 10.1.1.50
set deviceconfig system ntp-servers primary-ntp-server authentication-type none
set deviceconfig setting config rematch yes
set deviceconfig setting management idle-timeout 10
set shared log-settings syslog Syslog-Server server Syslog-Host transport UDP port 514 facility LOG_USER
set shared log-settings syslog Syslog-Server server Syslog-Host server 10.1.1.100
set network interface ethernet ethernet1/1 layer3 ip 172.16.1.1/24
set network interface ethernet ethernet1/1 comment "OUTSIDE-UNTRUST"
set network interface ethernet ethernet1/2 layer3 ip 10.10.10.1/24
set network interface ethernet ethernet1/2 comment "INSIDE-TRUST"
set network interface ethernet ethernet1/3 layer3 ip 192.168.100.1/24
set network interface ethernet ethernet1/3 comment "DMZ"
set network virtual-router default interface ethernet1/1
set network virtual-router default interface ethernet1/2
set network virtual-router default interface ethernet1/3
set network virtual-router default routing-table ip static-route default-route nexthop ip-address 172.16.1.254 interface ethernet1/1 metric 10
set rulebase security rules ALLOW-OUTBOUND from TRUST to UNTRUST source any destination any application any service application-default action allow log-start yes log-end yes
set rulebase security rules DENY-INBOUND from UNTRUST to TRUST source any destination any application any service any action deny log-start yes log-end yes
