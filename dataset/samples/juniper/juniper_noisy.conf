system {
    host-name JUNIPER-FW-10;
    services {
        ssh {
            protocol-version v2;
        }
        
    }
    login {
        class admin-class {
            idle-timeout 10;
        }
    }
    syslog {
        host 10.1.1.100 {
            any informational;
        }
    }
    ntp {
        server 10.1.1.50;
    }
}
snmp {
    community MyC0mmun1ty {
        authorization read-only;
    }
}
routing-options {
    static {
        route 0.0.0.0/0 next-hop 192.168.1.1;
    }
}

